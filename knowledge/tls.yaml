# TLS Findings
# Entries trigger on weak protocol version or weak cipher suite.

- id: TLS-WEAK-PROTOCOL
  title: Deprecated TLS Protocol Version
  description: >
    The server supports TLS 1.0 or TLS 1.1, which are deprecated by RFC 8996.
    These versions are vulnerable to BEAST, POODLE, and other downgrade attacks.
  severity: HIGH
  confidence: 0.98
  tls_weak_protocol: true
  cwe_id: CWE-326
  capec_id: CAPEC-217
  mitre_attack: [T1557.002]
  owasp: ["A02:2021 - Cryptographic Failures"]
  remediation: >
    Disable TLS 1.0 and TLS 1.1. Configure minimum TLS version to 1.2.
    Prefer TLS 1.3 where supported.

- id: TLS-WEAK-CIPHER
  title: Weak TLS Cipher Suite
  description: >
    The negotiated cipher suite uses a known-weak algorithm (RC4, DES, 3DES, MD5,
    EXPORT, NULL, or ANON). These ciphers can be broken by modern attacks.
  severity: HIGH
  confidence: 0.95
  tls_weak_cipher: true
  cwe_id: CWE-327
  capec_id: CAPEC-20
  owasp: ["A02:2021 - Cryptographic Failures"]
  remediation: >
    Remove weak cipher suites from the server TLS configuration.
    Use only AEAD ciphers (AES-GCM, ChaCha20-Poly1305).

- id: TLS-CERT-EXPIRED
  title: Expired TLS Certificate
  description: >
    The server presented an X.509 TLS certificate whose validity period (NotAfter)
    has elapsed. Expired certificates erode trust and may indicate neglected
    infrastructure or an active man-in-the-middle attack.
  severity: HIGH
  confidence: 0.99
  tls_expired_cert: true
  cwe_id: CWE-298
  capec_id: CAPEC-94
  mitre_attack: [T1557]
  owasp: ["A02:2021 - Cryptographic Failures", "A07:2021 - Identification and Authentication Failures"]
  remediation: >
    Renew the TLS certificate immediately and configure automated renewal
    (e.g., via ACME / Let's Encrypt certbot).

- id: TLS-CERT-SELF-SIGNED
  title: Self-Signed TLS Certificate
  description: >
    The server certificate is self-signed (Issuer matches Subject) and is not
    trusted by public Certificate Authorities, allowing trivial active MITM spoofing.
  severity: MEDIUM
  confidence: 0.95
  tls_self_signed: true
  cwe_id: CWE-295
  capec_id: CAPEC-94
  mitre_attack: [T1557]
  owasp: ["A02:2021 - Cryptographic Failures"]
  remediation: >
    Replace the self-signed certificate with one issued by a trusted Certificate Authority (CA).
