name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X github.com/khaleddevsec/Reconpipeline/internal/version.Version=dev" \
            -o dist/reconpipeline-linux-amd64 \
            ./cmd/reconpipeline/

      - name: Build (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X github.com/khaleddevsec/Reconpipeline/internal/version.Version=dev" \
            -o dist/reconpipeline-linux-arm64 \
            ./cmd/reconpipeline/
