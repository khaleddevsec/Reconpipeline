name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X github.com/khaleddevsec/Reconpipeline/internal/version.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/reconpipeline-linux-amd64 \
            ./cmd/reconpipeline/

      - name: Build linux/arm64
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X github.com/khaleddevsec/Reconpipeline/internal/version.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/reconpipeline-linux-arm64 \
            ./cmd/reconpipeline/

      - name: Create compressed archives
        run: |
          cd dist
          tar czf reconpipeline-linux-amd64.tar.gz reconpipeline-linux-amd64
          tar czf reconpipeline-linux-arm64.tar.gz reconpipeline-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Reconpipeline ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Reconpipeline ${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Installation

            ```bash
            cd /root
            mkdir Reconpipeline
            cd Reconpipeline
            git clone https://github.com/khaleddevsec/Reconpipeline.git .
            chmod +x install.sh
            ./install.sh
            ```

            ## Quick update

                reconpipeline update
          files: |
            dist/reconpipeline-linux-amd64
            dist/reconpipeline-linux-arm64
            dist/reconpipeline-linux-amd64.tar.gz
            dist/reconpipeline-linux-arm64.tar.gz
