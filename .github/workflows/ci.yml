name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Formatting (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files found:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -cover -coverprofile coverage.out ./...

      - name: Run Race Detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -v ./...

      - name: Build Binary
        run: |
          go build -v .
          go build -v ./cmd/threatlens

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: threatlens:latest
